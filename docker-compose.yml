services:

  backend:

    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: smartspend-backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    restart: always


  frontend:

    build:
      context: ./smartspend-web
      dockerfile: Dockerfile.frontend

    container_name: smartspend-frontend

    ports:
      - "3000:3000"

    environment:
      BACKEND_URL: http://backend:8000
      SESSION_SECRET: smartspend-docker-secret
      PORT: 3000

    depends_on:
      - backend

    restart: always