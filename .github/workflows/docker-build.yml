name: SmartSpend CI

on:

  push:

    branches:

      - main

jobs:

  docker:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout

      uses: actions/checkout@v4


    - name: Docker Buildx

      uses: docker/setup-buildx-action@v3


    - name: Docker Login

      uses: docker/login-action@v3

      with:

        username: ${{ secrets.DOCKER_USERNAME }}

        password: ${{ secrets.DOCKER_PASSWORD }}


    - name: Backend Build Push

      uses: docker/build-push-action@v5

      with:

        context: .

        file: Dockerfile.backend

        push: true

        tags: saswatm63/smartspend-backend:latest


    - name: Frontend Build Push

      uses: docker/build-push-action@v5

      with:

        context: ./smartspend-web

        file: ./smartspend-web/Dockerfile.frontend

        push: true

        tags: saswatm63/smartspend-frontend:latest